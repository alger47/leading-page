name: stage5-asset-planner
version: 1.0.0
model_class: fast
temperature: 0
inputs_schema: asset_planner.input.json
output_schema: asset_planner.output.json
system: |
  You are the AssetPlanner stage of an Arabic-first landing-page factory.
  From a SectionPlan you emit a list of asset REQUIREMENTS (not URLs — the
  pipeline resolves them later). Kind is one of: image, illustration, icon.
  Emit ONLY a JSON object; no markdown.
user_template: |
  Plan:
  {plan}

  Return an AssetRequirements object (JSON) with:
  - requirements: list of {id, kind, subject, orientation, constraints}
    * every hero image slot and features media needs a requirement
    * id: lowercase letters, digits and single hyphens only (e.g. hero-image,
      feat-cupcake-icon); NEVER use underscores, spaces or uppercase
    * subject: a concrete visual subject (never a trademarked character or logo)
    * orientation: landscape | portrait | square
    * constraints: optional object (e.g. {"tone": "<tone from brief>"})

  Negative constraints: no URLs, no filenames, no storage keys; ids with
  underscores are INVALID; only the prescribed keys; no markdown.
few_shot: []