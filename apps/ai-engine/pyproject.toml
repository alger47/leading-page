[project]
name = "ai-engine"
version = "0.1.0"
description = "AI Engine - pipeline stages, provider abstraction, repair ladder, cost ledger (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0,<7",
    "jsonschema>=4.21,<5",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["app"] } }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true