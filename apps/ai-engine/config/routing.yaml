# Config-driven model routing (Master Prompt PART VI §6.3).
#
# Rule: changing a model MUST NOT require code changes — only this config change
# plus an evaluation run. Per-stage: model_class, temperature, max attempts,
# fallback order. Per model class: provider + per-1k-token cost + default model_id.
#
# provider values: stub | openai | anthropic | ollama | gemini | qwen | local

models:
  fast:
    provider: stub
    model_id: "stub-fast"
    cost_per_1k_input: 0.0001
    cost_per_1k_output: 0.0004
  premium:
    provider: stub
    model_id: "stub-premium"
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
  # Pinned LLM-as-judge model (PART IX §9.4): advisory scorer. Falls back to
  # the deterministic StubJudge when the provider has no credentials.
  judge:
    provider: openai
    model_id: "gpt-4o-mini"
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0006
  # Optional LLM for the brief-analyzer ONLY (opt in with AI_BRIEF_ANALYZER_LLM
  # set AND AI_OPENAI_API_KEY — Phase 13, LLM-aware vertical/tone/facts
  # detection). The runner's fallback list still degrades to the stub analyzer
  # on a hard provider error. Point `provider` at "anthropic" (and set
  # AI_ANTHROPIC_API_KEY) to use Claude instead.
  brief-llm:
    provider: openai
    model_id: "gpt-4o-mini"
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0006

stages:
  brief-analyzer:
    prompt: stage1-brief-analyzer
    model_class: fast
    temperature: 0
    max_attempts: 2
    fallbacks: [fast, premium]
  page-planner:
    prompt: stage2-page-planner
    model_class: fast
    temperature: 0
    max_attempts: 2
    fallbacks: [fast, premium]
  layout-planner:
    prompt: stage3-layout-planner
    model_class: fast
    temperature: 0
    max_attempts: 2
    fallbacks: [fast, premium]
  content-generator:
    prompt: stage4-content-generator
    model_class: premium
    temperature: 0.6
    max_attempts: 3
    fallbacks: [premium, fast]
  asset-planner:
    prompt: stage5-asset-planner
    model_class: fast
    temperature: 0
    max_attempts: 2
    fallbacks: [fast, premium]
  # Stage 6 asset-renderer — deterministic image-generation stage (no LLM
  # routing). Entry is descriptive for the stage catalog/healthz; it runs only
  # when AI_IMAGE_PROVIDER is enabled AND the request opts in (generate_images).
  asset-renderer:
    prompt: stage6-asset-renderer
    model_class: fast
    temperature: 0
    max_attempts: 1
    fallbacks: [fast]

# Stage 6 asset-renderer (image generation). The entrypoint env var
# AI_IMAGE_PROVIDER (off|stub|huggingface) decides whether stage 6 runs at all;
# `provider` here is descriptive. OFF by default: no image generation until an
# operator enables it and sets AI_IMAGE_HF_TOKEN.
images:
  default:
    provider: huggingface
    model_id: "black-forest-labs/FLUX.1-schnell"
    cost_per_image: 0.0
    size: "1024x1024"

job:
  max_total_attempts: 18
  default_budget_usd: 0.25