# Config-driven model routing — Groq (provider: openai, base_url api.groq.com).
# Deployed config for production. `routing.yaml` stays as the stub/dev default.
# See the parity comments in apps/ai-engine/config/routing.yaml.

models:
  fast:
    provider: openai
    model_id: "qwen/qwen3.8-27b"
    cost_per_1k_input: 0.00005
    cost_per_1k_output: 0.00008
  premium:
    provider: openai
    model_id: "qwen/qwen3.8-27b"
    cost_per_1k_input: 0.0001
    cost_per_1k_output: 0.0003
  judge:
    provider: openai
    model_id: "qwen/qwen3.8-27b"
    cost_per_1k_input: 0.0001
    cost_per_1k_output: 0.0003
  brief-llm:
    provider: openai
    model_id: "qwen/qwen3.8-27b"
    cost_per_1k_input: 0.00005
    cost_per_1k_output: 0.00008

stages:
  brief-analyzer:
    prompt: stage1-brief-analyzer
    model_class: fast
    temperature: 0
    max_attempts: 2
    max_output_tokens: 700
    fallbacks: [fast, premium]
  page-planner:
    prompt: stage2-page-planner
    model_class: fast
    temperature: 0
    max_attempts: 2
    max_output_tokens: 1600
    fallbacks: [fast, premium]
  layout-planner:
    prompt: stage3-layout-planner
    model_class: fast
    temperature: 0
    max_attempts: 2
    max_output_tokens: 1200
    fallbacks: [fast, premium]
  content-generator:
    prompt: stage4-content-generator
    model_class: premium
    temperature: 0.6
    max_attempts: 3
    max_output_tokens: 2400
    fallbacks: [premium, fast]
  asset-planner:
    prompt: stage5-asset-planner
    model_class: fast
    temperature: 0
    max_attempts: 3
    max_output_tokens: 1000
    fallbacks: [fast, premium]
  # Stage 6 asset-renderer — deterministic image-generation stage (no LLM
  # routing). Entry is descriptive for the stage catalog/healthz; it runs only
  # when AI_IMAGE_PROVIDER is enabled AND the request opts in (generate_images).
  asset-renderer:
    prompt: stage6-asset-renderer
    model_class: fast
    temperature: 0
    max_attempts: 1
    max_output_tokens: 100
    fallbacks: [fast]

# Stage 6 asset-renderer. OFF until AI_IMAGE_PROVIDER=huggingface AND
# AI_IMAGE_HF_TOKEN are set on the engine service (sync:false env var).
images:
  default:
    provider: huggingface
    model_id: "black-forest-labs/FLUX.1-schnell"
    cost_per_image: 0.0
    size: "1024x1024"

job:
  max_total_attempts: 18
  default_budget_usd: 0.25