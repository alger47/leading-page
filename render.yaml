# Render Blueprint â€” Leading Page AI platform (monorepo: web + worker + ai-engine)
# Deploy once:  render.com â†’ Dashboard â†’ New â†’ Blueprint â†’ connect the repo
# Each push re-deploys affected services.

databases:
  - name: landing-ai-db
    plan: free
    databaseName: landing_ai

services:
  # --------------------------------------------------------------------------
  # web â€” Next.js app (auth, dashboard, project brief, generation UI, preview)
  # --------------------------------------------------------------------------
  - type: web
    name: web
    runtime: node
    plan: free
    buildCommand: >-
      npm install -g pnpm@9.15.0 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @landing-ai/database generate &&
      pnpm --filter @landing-ai/database migrate:deploy &&
      pnpm exec turbo build --filter @landing-ai/web
    startCommand: pnpm --filter @landing-ai/web start
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landing-ai-db
          property: connectionString
      # Free web services can't RECEIVE private-network traffic, so worker calls
      # go over its public URL. Auth is enforced by the shared X-Internal-Token.
      - key: WORKER_URL
        fromService:
          name: worker
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WORKER_INTERNAL_TOKEN
        fromService:
          name: worker
          type: web
          envVarKey: WORKER_INTERNAL_TOKEN

  # --------------------------------------------------------------------------
  # worker â€” BullMQ/Fastify job service. type:web (pserv has no free plan; free
  # web services can't receive private traffic either). Public but every route
  # except /healthz requires X-Internal-Token (server.ts onRequest hook).
  # --------------------------------------------------------------------------
  - type: web
    name: worker
    runtime: node
    plan: free
    buildCommand: >-
      npm install -g pnpm@9.15.0 &&
      pnpm install --frozen-lockfile &&
      pnpm exec turbo build --filter @landing-ai/worker
    startCommand: pnpm --filter @landing-ai/worker start
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          name: cache
          type: keyvalue
          property: connectionString
      - key: AI_ENGINE_URL
        fromService:
          name: ai-engine
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_INTERNAL_TOKEN
        fromService:
          name: ai-engine
          type: web
          envVarKey: AI_INTERNAL_TOKEN
      # Generated once; copied to the web service via envVarKey above.
      - key: WORKER_INTERNAL_TOKEN
        generateValue: true
      - key: QUEUE_NAME
        value: generation-jobs
      - key: ENGINE_TIMEOUT_MS
        value: "120000"
      - key: MAX_ATTEMPTS
        value: "3"

  # --------------------------------------------------------------------------
  # ai-engine â€” FastAPI generation pipeline. type:web for free tier; every
  # /internal/* route is token-protected (deps.py require_internal_token).
  # --------------------------------------------------------------------------
  - type: web
    name: ai-engine
    runtime: python
    plan: free
    rootDir: apps/ai-engine
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Generated once; copied to the worker via envVarKey above.
      - key: AI_INTERNAL_TOKEN
        generateValue: true
      - key: AI_ENV
        value: production
      - key: AI_SERVICE_NAME
        value: ai-engine
      - key: AI_VERSION
        value: "0.1.0"
      - key: AI_PROVIDER
        value: stub
      - key: AI_ROUTING_CONFIG_PATH
        value: config/routing.yaml
      # Set a real Groq key here once (Dashboard â€” Service â€” Environment), then
      # flip AI_PROVIDER to openai and point AI_OPENAI_BASE_URL at
      # https://api.groq.com/openai/v1 to enable real-LLM generation.
      - key: AI_OPENAI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # cache â€” Redis-compatible Key Value (BullMQ queue).
  # noeviction: LRU eviction would silently drop queued generation jobs.
  # Free plan: 25 MB, no persistence. Enough for a demo/queue.
  # --------------------------------------------------------------------------
  - type: keyvalue
    name: cache
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []