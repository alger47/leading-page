# Render Blueprint - Leading Page AI platform (monorepo: web + worker + ai-engine)
# Deploy once:  render.com -> Dashboard -> New -> Blueprint -> connect the repo
# Each push re-deploys affected services.

# NOTE: this workspace already owns one free Postgres and one free Key Value.
# Render's free tier allows only one of each, so declaring them here makes the
# Blueprint try to create duplicates and fail the sync. We therefore omit them
# and accept their connection strings via `sync: false` (Dashboard prompts).
services:
  # --------------------------------------------------------------------------
  # web - Next.js app (auth, dashboard, project brief, generation UI, preview)
  # --------------------------------------------------------------------------
  - type: web
    name: web
    runtime: node
    plan: free
    buildCommand: >-
      npm install -g pnpm@9.15.0 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @landing-ai/database generate &&
      pnpm --filter @landing-ai/database migrate:deploy &&
      pnpm exec turbo build --filter @landing-ai/web
    startCommand: pnpm --filter @landing-ai/web start
    healthCheckPath: /api/v1/healthz
    envVars:
      # Existing free Postgres `landing-ai-db` — paste its connection string
      # (Internal Database URL) when Render prompts.
      - key: DATABASE_URL
        sync: false
      # Free web services can't RECEIVE private-network traffic, so worker calls
      # go over its public URL. Auth is enforced by the shared X-Internal-Token.
      # Derived from the worker's own Render URL so a fresh Blueprint deploy
      # works without knowing the randomly-suffixed subdomain.
      - key: WORKER_URL
        fromService:
          name: worker
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WORKER_INTERNAL_TOKEN
        fromService:
          name: worker
          type: web
          envVarKey: WORKER_INTERNAL_TOKEN
      # Published pages link back to this app's own public URL.
      - key: PUBLIC_BASE_URL
        fromService:
          name: web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # --------------------------------------------------------------------------
  # worker - BullMQ/Fastify job service. type:web (pserv has no free plan; free
  # web services can't receive private traffic either). Public but every route
  # except /healthz requires X-Internal-Token (server.ts onRequest hook).
  # --------------------------------------------------------------------------
  - type: web
    name: worker
    runtime: node
    plan: free
    buildCommand: >-
      npm install -g pnpm@9.15.0 &&
      pnpm install --frozen-lockfile &&
      pnpm exec turbo build --filter @landing-ai/worker
    startCommand: pnpm --filter @landing-ai/worker start
    healthCheckPath: /healthz
    envVars:
      # Existing free Key Value `cache` — paste its Internal connection string
      # (redis://...) when Render prompts.
      - key: REDIS_URL
        sync: false
      - key: AI_ENGINE_URL
        fromService:
          name: ai-engine
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_INTERNAL_TOKEN
        fromService:
          name: ai-engine
          type: web
          envVarKey: AI_INTERNAL_TOKEN
      # Generated once; copied to the web service via envVarKey above.
      - key: WORKER_INTERNAL_TOKEN
        generateValue: true
      - key: QUEUE_NAME
        value: generation-jobs
      - key: ENGINE_TIMEOUT_MS
        value: "300000"
      - key: MAX_ATTEMPTS
        value: "3"

  # --------------------------------------------------------------------------
  # ai-engine - FastAPI generation pipeline. type:web for free tier; every
  # /internal/* route is token-protected (deps.py require_internal_token).
  # --------------------------------------------------------------------------
  - type: web
    name: ai-engine
    runtime: python
    plan: free
    rootDir: apps/ai-engine
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Generated once; copied to the worker via envVarKey above.
      - key: AI_INTERNAL_TOKEN
        generateValue: true
      - key: AI_ENV
        value: production
      - key: AI_SERVICE_NAME
        value: ai-engine
      - key: AI_VERSION
        value: "0.1.0"
      - key: AI_PROVIDER
        value: openai
      - key: AI_ROUTING_CONFIG_PATH
        value: config/routing.groq.yaml
      # Groq is OpenAI-compatible and config/routing.groq.yaml pins every model
      # class to `provider: openai`, so these two variables enable real LLM
      # generation. The key value is entered in the Dashboard (never in git);
      # `sync: false` makes Render prompt for it on Blueprint creation.
      - key: AI_OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_OPENAI_API_KEY
        sync: false