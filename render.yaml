# Render Blueprint — Leading Page AI platform (monorepo: web + worker + ai-engine)
# Deploy once:  render.com → Dashboard → New → Blueprint → connect the repo
# Each push re-deploys affected services.

databases:
  - name: landing-ai-db
    plan: basic-256mb
    databaseName: landing_ai

services:
  # --------------------------------------------------------------------------
  # web — Next.js app (auth, dashboard, project brief, generation UI, preview)
  # --------------------------------------------------------------------------
  - type: web
    name: web
    runtime: node
    plan: starter
    buildCommand: >-
      npm install -g pnpm@9 &&
      pnpm install --frozen-lockfile &&
      pnpm exec prisma generate --schema packages/database/prisma/schema.prisma &&
      pnpm exec turbo build --filter @landing-ai/web
    startCommand: pnpm --filter @landing-ai/web start
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landing-ai-db
          property: connectionString
      - key: WORKER_URL
        fromService:
          name: worker
          type: pserv
          envVarKey: RENDER_INTERNAL_URL
      - key: WORKER_INTERNAL_TOKEN
        fromService:
          name: worker
          type: pserv
          envVarKey: WORKER_INTERNAL_TOKEN

  # --------------------------------------------------------------------------
  # worker — BullMQ/Fastify job service (private: only reachable inside Render)
  # --------------------------------------------------------------------------
  - type: pserv
    name: worker
    runtime: node
    plan: starter
    buildCommand: >-
      npm install -g pnpm@9 &&
      pnpm install --frozen-lockfile &&
      pnpm exec turbo build --filter @landing-ai/worker
    startCommand: pnpm --filter @landing-ai/worker start
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          name: cache
          type: keyvalue
          property: connectionString
      - key: AI_ENGINE_URL
        fromService:
          name: ai-engine
          type: pserv
          envVarKey: RENDER_INTERNAL_URL
      - key: AI_INTERNAL_TOKEN
        fromService:
          name: ai-engine
          type: pserv
          envVarKey: AI_INTERNAL_TOKEN
      # Generated once; copied to the web service via envVarKey above.
      - key: WORKER_INTERNAL_TOKEN
        generateValue: true
      - key: QUEUE_NAME
        value: generation-jobs
      - key: ENGINE_TIMEOUT_MS
        value: "120000"
      - key: MAX_ATTEMPTS
        value: "3"

  # --------------------------------------------------------------------------
  # ai-engine — FastAPI generation pipeline (private: only reachable inside Render)
  # --------------------------------------------------------------------------
  - type: pserv
    name: ai-engine
    runtime: python
    pythonVersion: "3.11"
    plan: starter
    rootDir: apps/ai-engine
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Generated once; copied to the worker via envVarKey above.
      - key: AI_INTERNAL_TOKEN
        generateValue: true
      - key: AI_ENV
        value: production
      - key: AI_SERVICE_NAME
        value: ai-engine
      - key: AI_VERSION
        value: "0.1.0"
      - key: AI_PROVIDER
        value: stub
      - key: AI_ROUTING_CONFIG_PATH
        value: config/routing.yaml
      # Set a real Groq key here once (Dashboard → Service → Environment), then
      # flip AI_PROVIDER to openai and point AI_OPENAI_BASE_URL at
      # https://api.groq.com/openai/v1 to enable real-LLM generation.
      - key: AI_OPENAI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # cache — Redis-compatible Key Value (BullMQ queue)
  # noeviction: LRU eviction would silently drop queued generation jobs.
  # --------------------------------------------------------------------------
  - type: keyvalue
    name: cache
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []