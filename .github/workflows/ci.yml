name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  engine:
    name: AI engine (pytest · ruff · mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine deps
        run: python -m pip install -e '.[dev]'
      - name: pytest
        run: python -m pytest -q
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy app

  web-ts:
    name: Web / packages (typecheck · build · unit · QA gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: landing_ai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Package unit suites (infra-free)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/landing_ai_test
        run: |
          pnpm --filter @landing-ai/page-schema test
          pnpm --filter @landing-ai/visual-qa test
          pnpm --filter @landing-ai/telemetry test
          pnpm --filter @landing-ai/ui-components test
          pnpm --filter @landing-ai/worker test
          pnpm --filter @landing-ai/database test
          pnpm --filter @landing-ai/web test
      - name: QA gate (L1/L2 fixtures · L3 baseline · publish budget)
        run: pnpm qa